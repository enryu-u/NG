/* ===================== PMOC > CHECKLISTS: um cartão por checklist e um editor simples por dentro =====================
 * Cada item: chave liga/desliga, texto, periodicidade (menu flutuante) e tipo de resposta (OK/NOK ou medição).
 * Tudo é salvo na hora (mesma aba CHECKLIST PMOC da planilha). */
const PERIODOS = [['Mensal', 'todo mês'], ['Bimestral', 'a cada 2 meses'], ['Trimestral', 'a cada 3 meses'], ['Semestral', 'a cada 6 meses'], ['Anual', 'uma vez por ano']];
const ckAtivo = x => !/^n/i.test(String(x['Ativo?'] || 'Sim').trim());
async function telaChecklists(alvo, abrir) {
  const vez = E.vez; carregarEm(alvo, 'Buscando os checklists…');
  let ck, tp;
  try { [ck, tp] = await Promise.all([api('listar', { tabela: 'CHECKLIST' }), api('listar', { tabela: 'TIPOS_EQ' })]); }
  catch (e) { if (viva(vez)) alvo.innerHTML = '<div class="vazio">' + esc(e.message) + '</div>'; return; }
  if (!viva(vez)) return;
  guardarTab('CHECKLIST', ck);
  const itens = ck.linhas.filter(x => String(x['Item'] || '').trim() && String(x['Checklist'] || '').trim());
  const nomes = Array.from(new Set(itens.map(x => x['Checklist']))).sort((a, b) => a.localeCompare(b, 'pt'));
  const usos = n => tp.linhas.filter(t => t['Checklist PMOC'] === n).map(t => t['Tipo de equipamento']);
  if (abrir) return editorChecklist(alvo, abrir, itens, usos(abrir));
  alvo.innerHTML = '<div class="ferramentas"><div class="cresce nota" style="margin:0">Toque num checklist para editar os itens dele.</div><button class="btn" id="cke-novo">' + ic('mais') + 'Novo checklist</button></div>' +
    '<div class="cke-grade">' + nomes.map(n => {
      const ls = itens.filter(x => x['Checklist'] === n), at = ls.filter(ckAtivo).length, u = usos(n);
      return '<button class="cke-cartao" data-ck="' + esc(n) + '"><b>' + esc(n) + '</b><span>' + at + ' de ' + ls.length + ' itens ligados</span>' +
        '<small>' + (u.length ? 'Usado por: ' + esc(u.slice(0, 3).join(', ')) + (u.length > 3 ? ' e mais ' + (u.length - 3) : '') : 'Nenhum tipo de equipamento usa') + '</small></button>';
    }).join('') + '</div>';
  $$('[data-ck]', alvo).forEach(b => b.onclick = () => editorChecklist(alvo, b.dataset.ck, itens, usos(b.dataset.ck)));
  $('#cke-novo', alvo).onclick = () => {
    const j = janela('Novo checklist', '<label class="campo"><span>Nome do checklist (ex.: Split cassete, Câmara fria)</span><input class="entrada" id="nc-nome"></label><p class="nota">Depois você escolhe os itens na lista do banco, separada por grupo.</p>',
      [{ txt: 'Cancelar', classe: 'sec', fn: () => j.fechar() }, { txt: 'Escolher os itens', fn: () => {
        const n = $('#nc-nome', j.el).value.trim();
        if (!n) return aviso('Escreva o nome do checklist.', 'erro');
        if (nomes.some(x => x.toLowerCase() === n.toLowerCase())) return aviso('Já existe um checklist com esse nome.', 'erro');
        j.fechar(); telaBancoItens(alvo, n, () => telaChecklists(alvo, n));
      } }]);
    setTimeout(() => $('#nc-nome', j.el).focus(), 50);
  };
}

function editorChecklist(alvo, nome, todos, usos) {
  E.vez++;
  const ls = todos.filter(x => x['Checklist'] === nome).sort((a, b) => (Number(a['Ordem']) || 9999) - (Number(b['Ordem']) || 9999));
  const grupos = Array.from(new Set(ls.map(x => x['Grupo'] || 'Geral')));
  const linha = x => {
    const med = x['Resposta'] === 'Medição';
    return '<div class="cke-item' + (ckAtivo(x) ? '' : ' desligado') + '" data-id="' + esc(x._id) + '">' +
      '<label class="chave" title="Ligar ou desligar este item"><input type="checkbox" data-f="ativo"' + (ckAtivo(x) ? ' checked' : '') + '><span></span></label>' +
      '<input class="cke-txt" data-f="item" value="' + esc(x['Item']) + '" aria-label="Atividade">' +
      '<div class="cke-ops"><button type="button" class="cke-per" data-f="per">' + esc(x['Periodicidade'] || 'Mensal') + ' ▾</button>' +
      '<div class="segmento cke-resp"><button type="button" data-r="OK/NOK/NA" class="' + (med ? '' : 'ativo') + '">OK / NOK</button><button type="button" data-r="Medição" class="' + (med ? 'ativo' : '') + '">Medição</button></div>' +
      '<input class="cke-un' + (med ? '' : ' oculto') + '" data-f="un" placeholder="unidade (°C, A, V…)" value="' + esc(x['Unidade'] || '') + '">' +
      '<button type="button" class="cke-lixo" title="Excluir item">' + ic('lixo') + '</button></div></div>';
  };
  alvo.innerHTML = '<div class="cke-topo"><button class="btn sec peq" id="cke-volta">← Checklists</button><div class="cresce"><h3>' + esc(nome) + '</h3><small>' +
    (usos.length ? 'Usado por: ' + esc(usos.join(', ')) : 'Nenhum tipo de equipamento usa este checklist (ligue em "Tipos de equipamento")') + '</small></div></div>' +
    '<p class="nota">As mudanças são salvas na hora. Item desligado não aparece nas próximas visitas (o histórico continua).</p>' +
    grupos.map(g => '<section class="cke-grupo"><h4>' + esc(g) + '</h4>' + ls.filter(x => (x['Grupo'] || 'Geral') === g).map(linha).join('') +
      '<button type="button" class="btn sec peq" data-add="' + esc(g) + '">' + ic('mais') + 'Adicionar item em "' + esc(g) + '"</button></section>').join('') +
    (ls.length ? '' : '<div class="vazio">Este checklist ainda não tem itens.</div>') +
    '<button type="button" class="btn" id="cke-banco">' + ic('mais') + 'Adicionar itens</button>';
  const recarregar = () => telaChecklists(alvo, nome);
  const reg = id => ls.find(x => x._id === id);
  const salvar = async (el, valores) => {
    const id = el.closest('.cke-item').dataset.id;
    try { await api('salvar', { tabela: 'CHECKLIST', id, valores }); Object.assign(reg(id), valores); E.pre && delete E.pre.CHECKLIST; MEM.gravar(chaveTab('CHECKLIST'), null); return true; }
    catch (e) { aviso(e.message, 'erro'); return false; }
  };
  $('#cke-volta', alvo).onclick = () => telaChecklists(alvo);
  $$('.cke-item', alvo).forEach(it => {
    const x = reg(it.dataset.id);
    $('[data-f="ativo"]', it).onchange = async e => { const v = e.target.checked; it.classList.toggle('desligado', !v); if (!(await salvar(it, { 'Ativo?': v ? 'Sim' : 'Não' }))) { e.target.checked = !v; it.classList.toggle('desligado', v); } };
    const txt = $('[data-f="item"]', it);
    txt.onchange = async () => { const v = txt.value.trim(); if (!v) { txt.value = x['Item']; return aviso('A atividade não pode ficar em branco.', 'erro'); } if (await salvar(it, { 'Item': v })) aviso('Salvo.', 'ok'); else txt.value = x['Item']; };
    txt.onkeydown = e => { if (e.key === 'Enter') txt.blur(); };
    const per = $('[data-f="per"]', it);
    per.onclick = () => menuFlutuante(per, PERIODOS.map(([v, d]) => ({ v, t: v, d })), x['Periodicidade'] || 'Mensal', async v => { if (await salvar(it, { 'Periodicidade': v })) per.textContent = v + ' ▾'; });
    $$('[data-r]', it).forEach(b => b.onclick = async () => {
      if (b.classList.contains('ativo')) return;
      if (await salvar(it, { 'Resposta': b.dataset.r })) { $$('[data-r]', it).forEach(o => o.classList.toggle('ativo', o === b)); $('[data-f="un"]', it).classList.toggle('oculto', b.dataset.r !== 'Medição'); if (b.dataset.r === 'Medição') $('[data-f="un"]', it).focus(); }
    });
    const un = $('[data-f="un"]', it); un.onchange = () => salvar(it, { 'Unidade': un.value.trim() });
    $('.cke-lixo', it).onclick = async () => {
      let av = []; try { av = (await api('avisosExcluir', { tabela: 'CHECKLIST', id: x._id })).avisos || []; } catch (e) { }
      if (!(await perguntar('Excluir item?', '"' + x['Item'] + '"\n\n' + (av.length ? '• ' + av.join('\n• ') + '\n\n' : '') + 'Não dá para desfazer.', 'Excluir', true))) return;
      try { await api('limpar', { tabela: 'CHECKLIST', id: x._id }); aviso('Item excluído.', 'ok'); recarregar(); } catch (e) { aviso(e.message, 'erro'); }
    };
  });
  const ordemMax = () => ls.reduce((s, x) => Math.max(s, Number(x['Ordem']) || 0), 0);
  // adicionar item = escolher na lista do banco, separada por grupo (o grupo tocado já vem aberto)
  $$('[data-add]', alvo).forEach(b => b.onclick = () => telaBancoItens(alvo, nome, recarregar, b.dataset.add));
  $('#cke-banco', alvo).onclick = () => telaBancoItens(alvo, nome, recarregar);
}

/* ===================== PMOC > BANCO DE ITENS =====================
 * A biblioteca de atividades, organizada por GRUPO (Evaporadora, Elétrica, Medições…). Fica na aba BANCO DE ITENS.
 * - Pela aba "Banco de itens": cria grupos e itens, edita texto, periodicidade e resposta, exclui.
 * - Pelo editor de um checklist ("Trazer itens do banco"): destino = o checklist; marca os itens e acrescenta. */
async function telaBancoItens(alvo, destino, volta, grupoIni) {
  const vez = E.vez; carregarEm(alvo, 'Abrindo o banco de itens…');
  let bc, ck;
  try { [bc, ck] = await Promise.all([api('listar', { tabela: 'BANCO' }), destino ? api('listar', { tabela: 'CHECKLIST' }) : Promise.resolve(null)]); }
  catch (e) { if (viva(vez)) alvo.innerHTML = '<div class="vazio">' + esc(e.message) + '</div>'; return; }
  if (!viva(vez)) return;
  const escolher = !!destino;
  const chave = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const itens = bc.linhas.filter(x => String(x['Item'] || '').trim());
  const jaTem = {}; if (ck) ck.linhas.filter(x => x['Checklist'] === destino).forEach(x => { jaTem[chave(x['Item'])] = 1; });
  const grupos = () => Array.from(new Set(itens.map(x => x['Grupo'] || 'Geral'))).sort((a, b) => a.localeCompare(b, 'pt'));
  const marcados = new Set(), abertos = new Set(grupoIni ? [grupoIni] : []);
  alvo.innerHTML = (escolher ? '<div class="cke-topo"><button class="btn sec peq" id="bi-volta">← Voltar para ' + esc(destino) + '</button><div class="cresce"><h3>Adicionar itens em ' + esc(destino) + '</h3><small>Escolha na lista do banco, separada por grupo. Os que o checklist já tem aparecem apagados.</small></div></div>'
      : '<div class="ferramentas"><div class="cresce nota" style="margin:0">Os itens ficam organizados por grupo. Para colocar itens num checklist, use a aba Checklists > "Adicionar item".</div><button class="btn" id="bi-grupo">' + ic('mais') + 'Novo grupo</button></div>') +
    '<label class="campo"><span>Procurar</span><input class="entrada" id="bi-busca" placeholder="Ex.: filtro, dreno, corrente…"></label><div id="bi-lista"></div>' +
    (escolher ? '<button type="button" class="btn sec peq" id="bi-grupo-novo" style="margin:4px 0 12px">' + ic('mais') + 'Criar grupo novo</button>' : '') +
    (escolher ? '<div class="barra-salvar"><span class="cresce" id="bi-conta">Nenhum item marcado</span><button class="btn" id="bi-add" disabled>' + ic('mais') + 'Adicionar em ' + esc(destino) + '</button></div>' : '');
  const linha = x => {
    const med = x['Resposta'] === 'Medição', det = esc(x['Periodicidade'] || 'Mensal') + ' · ' + (med ? 'Medição' + (x['Unidade'] ? ' (' + esc(x['Unidade']) + ')' : '') : 'OK / NOK');
    if (escolher) {
      const tem = jaTem[chave(x['Item'])];
      return '<label class="bi-item' + (tem ? ' tem' : '') + '"><input type="checkbox" data-id="' + esc(x._id) + '"' + (tem ? ' disabled' : marcados.has(x._id) ? ' checked' : '') + '>' +
        '<span class="bi-txt"><b>' + esc(x['Item']) + '</b><small>' + det + '</small></span>' + (tem ? '<span class="tag">já tem</span>' : '') + '</label>';
    }
    return '<div class="cke-item bi-ed" data-id="' + esc(x._id) + '"><input class="cke-txt" data-f="item" value="' + esc(x['Item']) + '" aria-label="Atividade">' +
      '<div class="cke-ops"><button type="button" class="cke-per" data-f="per">' + esc(x['Periodicidade'] || 'Mensal') + ' ▾</button>' +
      '<div class="segmento cke-resp"><button type="button" data-r="OK/NOK/NA" class="' + (med ? '' : 'ativo') + '">OK / NOK</button><button type="button" data-r="Medição" class="' + (med ? 'ativo' : '') + '">Medição</button></div>' +
      '<input class="cke-un' + (med ? '' : ' oculto') + '" data-f="un" placeholder="unidade (°C, A, V…)" value="' + esc(x['Unidade'] || '') + '">' +
      '<button type="button" class="cke-lixo" title="Excluir do banco">' + ic('lixo') + '</button></div></div>';
  };
  const pintar = () => {
    const b = chave($('#bi-busca', alvo).value);
    const html = grupos().map(g => {
      const ls = itens.filter(x => (x['Grupo'] || 'Geral') === g && (!b || chave(x['Item'] + ' ' + g).indexOf(b) >= 0));
      if (b && !ls.length) return '';
      const aberto = b || abertos.has(g);
      return '<section class="cke-grupo bi-grupo' + (aberto ? ' aberto' : '') + '" data-g="' + esc(g) + '"><button type="button" class="bi-cab"><b>' + esc(g) + '</b><span>' + ls.length + ' item(ns)</span><i>' + (aberto ? '▴' : '▾') + '</i></button>' +
        (aberto ? '<div class="bi-corpo">' + ls.map(linha).join('') + '<button type="button" class="btn sec peq" data-add="' + esc(g) + '">' + ic('mais') + (escolher ? 'Não achou? Criar item novo em "' : 'Item em "') + esc(g) + '"</button></div>' : '') + '</section>';
    }).join('');
    $('#bi-lista', alvo).innerHTML = html || '<div class="vazio">Nenhum item encontrado.</div>';
    $$('.bi-cab', alvo).forEach(c => c.onclick = () => { const g = c.parentNode.dataset.g; abertos.has(g) ? abertos.delete(g) : abertos.add(g); pintar(); });
    if (escolher) {
      $$('#bi-lista input[data-id]', alvo).forEach(c => c.onchange = () => { c.checked ? marcados.add(c.dataset.id) : marcados.delete(c.dataset.id); contar(); });
      // item que não está no banco: cria no banco e já deixa marcado
      $$('[data-add]', alvo).forEach(b => b.onclick = () => janelaItemBanco(b.dataset.add, novo => { itens.push(novo); marcados.add(novo._id); abertos.add(novo['Grupo']); pintar(); }));
      contar();
    }
    else ligarEdicao();
  };
  const contar = () => { const n = marcados.size; $('#bi-conta', alvo).textContent = n ? n + ' item(ns) marcado(s)' : 'Nenhum item marcado'; $('#bi-add', alvo).disabled = !n; };
  const salvar = async (el, valores) => {
    const id = el.closest('[data-id]').dataset.id;
    try { await api('salvar', { tabela: 'BANCO', id, valores }); Object.assign(itens.find(x => x._id === id), valores); return true; } catch (e) { aviso(e.message, 'erro'); return false; }
  };
  const ligarEdicao = () => {
    $$('.bi-ed', alvo).forEach(it => {
      const x = itens.find(i => i._id === it.dataset.id);
      const txt = $('[data-f="item"]', it);
      txt.onchange = async () => { const v = txt.value.trim(); if (!v) { txt.value = x['Item']; return aviso('A atividade não pode ficar em branco.', 'erro'); } if (await salvar(it, { 'Item': v })) aviso('Salvo.', 'ok'); else txt.value = x['Item']; };
      txt.onkeydown = e => { if (e.key === 'Enter') txt.blur(); };
      const per = $('[data-f="per"]', it);
      per.onclick = () => menuFlutuante(per, PERIODOS.map(([v, d]) => ({ v, t: v, d })), x['Periodicidade'] || 'Mensal', async v => { if (await salvar(it, { 'Periodicidade': v })) per.textContent = v + ' ▾'; });
      $$('[data-r]', it).forEach(b => b.onclick = async () => {
        if (b.classList.contains('ativo')) return;
        if (await salvar(it, { 'Resposta': b.dataset.r })) { $$('[data-r]', it).forEach(o => o.classList.toggle('ativo', o === b)); $('[data-f="un"]', it).classList.toggle('oculto', b.dataset.r !== 'Medição'); }
      });
      const un = $('[data-f="un"]', it); un.onchange = () => salvar(it, { 'Unidade': un.value.trim() });
      $('.cke-lixo', it).onclick = async () => {
        if (!(await perguntar('Excluir do banco?', '"' + x['Item'] + '"\n\nOs checklists que já têm este item continuam com ele. Não dá para desfazer.', 'Excluir', true))) return;
        try { await api('limpar', { tabela: 'BANCO', id: x._id }); itens.splice(itens.indexOf(x), 1); aviso('Item excluído do banco.', 'ok'); pintar(); } catch (e) { aviso(e.message, 'erro'); }
      };
    });
    $$('[data-add]', alvo).forEach(b => b.onclick = () => janelaItemBanco(b.dataset.add, novo => { itens.push(novo); abertos.add(novo['Grupo']); pintar(); }));
  };
  let tm; $('#bi-busca', alvo).oninput = () => { clearTimeout(tm); tm = setTimeout(pintar, 200); };
  if (escolher) {
    $('#bi-volta', alvo).onclick = volta;
    $('#bi-grupo-novo', alvo).onclick = () => janelaItemBanco('', novo => { itens.push(novo); marcados.add(novo._id); abertos.add(novo['Grupo']); pintar(); });
    $('#bi-add', alvo).onclick = e => comBotao(e.currentTarget, async () => {
      const r = await api('checklistCopiar', { destino, ids: Array.from(marcados) });
      aviso(r.adicionados + ' item(ns) adicionado(s) em "' + destino + '".', 'ok');
      E.pre && delete E.pre.CHECKLIST; MEM.gravar(chaveTab('CHECKLIST'), null); volta();
    });
  } else $('#bi-grupo', alvo).onclick = () => janelaItemBanco('', novo => { itens.push(novo); abertos.add(novo['Grupo']); pintar(); });
  pintar();
  if (grupoIni) { const s = $('[data-g="' + grupoIni.replace(/"/g, '\\"') + '"]', alvo); if (s) s.scrollIntoView({ block: 'start' }); }
}
/* Novo item no banco (grupo vazio = pede o nome do grupo novo). */
function janelaItemBanco(grupo, depois) {
  const j = janela(grupo ? 'Novo item em "' + grupo + '"' : 'Novo grupo',
    (grupo ? '' : '<label class="campo"><span>Nome do grupo (ex.: Evaporadora, Quadro elétrico, Medições)</span><input class="entrada" id="ib-g"></label>') +
    '<label class="campo"><span>Atividade</span><input class="entrada" id="ib-i" placeholder="Ex.: Limpar os filtros de ar"></label>' +
    '<div class="campo"><span>Periodicidade</span><div class="segmento" id="ib-p">' + PERIODOS.map(([v], i) => '<button type="button" data-v="' + v + '" class="' + (i ? '' : 'ativo') + '">' + v + '</button>').join('') + '</div></div>' +
    '<div class="campo"><span>Resposta</span><div class="segmento" id="ib-r"><button type="button" data-v="OK/NOK/NA" class="ativo">OK / NOK</button><button type="button" data-v="Medição">Medição</button></div></div>' +
    '<label class="campo oculto" id="ib-ub"><span>Unidade da medição</span><input class="entrada" id="ib-u" placeholder="°C, A, V, psi…"></label>',
    [{ txt: 'Cancelar', classe: 'sec', fn: () => j.fechar() }, { txt: ic('ok') + 'Salvar', fn: b => comBotao(b, async () => {
      const g = grupo || $('#ib-g', j.el).value.trim(), it = $('#ib-i', j.el).value.trim();
      if (!g) throw new Error('Escreva o nome do grupo.');
      if (!it) throw new Error('Escreva a atividade.');
      const r = $('#ib-r .ativo', j.el).dataset.v;
      const v = { 'Grupo': g, 'Item': it, 'Periodicidade': $('#ib-p .ativo', j.el).dataset.v, 'Resposta': r, 'Unidade': r === 'Medição' ? $('#ib-u', j.el).value.trim() : '' };
      const res = await api('salvar', { tabela: 'BANCO', valores: v });
      aviso('Item criado no banco.', 'ok'); j.fechar(); depois(Object.assign({ _id: res.id }, v));
    }) }]);
  ['#ib-p', '#ib-r'].forEach(s => $$(s + ' button', j.el).forEach(b => b.onclick = () => { $$(s + ' button', j.el).forEach(o => o.classList.toggle('ativo', o === b)); if (s === '#ib-r') $('#ib-ub', j.el).classList.toggle('oculto', b.dataset.v !== 'Medição'); }));
  setTimeout(() => { const p = $(grupo ? '#ib-i' : '#ib-g', j.el); if (p) p.focus(); }, 50);
}
/* Menu flutuante simples ao lado de um botão (fecha ao tocar fora ou escolher). */
function menuFlutuante(botao, opcoes, atual, escolher) {
  $$('.menu-flut').forEach(m => m.remove());
  const m = document.createElement('div'); m.className = 'menu-flut';
  m.innerHTML = opcoes.map(o => '<button type="button" data-v="' + esc(o.v) + '" class="' + (o.v === atual ? 'ativo' : '') + '"><b>' + esc(o.t) + '</b>' + (o.d ? '<small>' + esc(o.d) + '</small>' : '') + '</button>').join('');
  document.body.appendChild(m);
  const r = botao.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left)) + 'px';
  m.style.top = (r.bottom + h + 8 > window.innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
  const fechar = () => { m.remove(); document.removeEventListener('mousedown', fora, true); window.removeEventListener('scroll', fechar, true); };
  const fora = e => { if (!m.contains(e.target) && e.target !== botao) fechar(); };
  setTimeout(() => { document.addEventListener('mousedown', fora, true); window.addEventListener('scroll', fechar, true); }, 0);
  $$('button', m).forEach(b => b.onclick = () => { fechar(); if (b.dataset.v !== atual) escolher(b.dataset.v); });
}

/* ---------- partida ---------- */
window.addEventListener('load', () => { E.token = MEM.ler('ngToken'); if (E.token) iniciar(); else mostrarLogin(); });
