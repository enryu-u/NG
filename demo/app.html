<!DOCTYPE html>
<html lang="pt-BR">
<head><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sistema NG · Demonstração</title>
<base target="_top">
<meta charset="UTF-8">
<script>
/* Aplica o tema e o lado do menu antes de desenhar a tela (evita piscar). */
(function () {
  var h = document.documentElement, ler = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var t = ler('ngTema') || 'auto';
  if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
  h.setAttribute('data-tema', t);
  h.setAttribute('data-lado', ler('ngLado') || 'direita');
  if (ler('ngRecolhido') === '1') h.classList.add('recolhido');
})();
</script>
<meta name="theme-color" content="#2f4656">
<style>
/* ===================== CORES (tema claro e escuro) ===================== */
:root{
  --azul:#0aa6cd; --azul-esc:#0789aa; --grafite:#2f4656; --titulo:#2f4656;
  --fundo:#f3f6f7; --cartao:#ffffff; --cartao2:#f6f9fa; --barra:#ffffffe6; --texto:#22343c; --suave:#6b7c84; --linha:#e2e8eb; --linha-forte:#bfd8df;
  --verde:#0f6e56; --verde-bg:#e1f5ee; --verde-borda:#b6e2d2; --vermelho:#a32d2d; --vermelho-bg:#fcebeb; --vermelho-borda:#f0c9c9;
  --ambar:#854f0b; --ambar-bg:#faeeda; --azul-bg:#e3f4f9; --logo-esc:#2f4656; --sombra:0 6px 24px #1b465014; --marca-op:.075;
  --graf-ent:#1d9e75; --graf-sai:#d85a30; --graf-prev:#9fd6e6;
  --raio:12px; --ease:cubic-bezier(.65,0,.25,1); --lat:248px; --lat-rec:72px;
  color-scheme:light;
}
html[data-tema="escuro"]{
  --grafite:#cfe0e6; --titulo:#e6f0f3; --fundo:#0e171b; --cartao:#162229; --cartao2:#1b2a32; --barra:#162229e6; --texto:#dce7eb; --suave:#8ea2aa;
  --linha:#263741; --linha-forte:#35505c; --verde:#5dcaa5; --verde-bg:#12352c; --verde-borda:#1f5a4a; --vermelho:#f09595; --vermelho-bg:#3d1c1c; --vermelho-borda:#6a2f2f;
  --ambar:#f2b65c; --ambar-bg:#3a2a12; --azul-bg:#123440; --logo-esc:#cfe0e6; --sombra:0 6px 24px #0006; --marca-op:.045;
  --graf-ent:#5dcaa5; --graf-sai:#f0997b; --graf-prev:#2b6377;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--fundo);color:var(--texto);font:15px/1.45 Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul-esc)} html[data-tema="escuro"] a{color:var(--azul)}
.oculto{display:none!important}

/* ===================== LOGO ===================== */
.ng-logo{--size:1;display:inline-flex;align-items:center;gap:calc(8px*var(--size));user-select:none}
.ng-logo svg{width:calc(120px*var(--size));height:auto;overflow:visible;flex:none}
.ng-logo path[fill="#2f4656"]{fill:var(--logo-esc)}
.ng-logo .wind{stroke:#fff;fill:none;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:0}
.ng-logo .word{font-weight:700;font-style:italic;white-space:nowrap;font-size:calc(40px*var(--size));letter-spacing:-.04em;line-height:1}
.ng-logo .word .ng{color:var(--logo-esc);font-weight:900}.ng-logo .word .ar{color:var(--azul)}
.ng-logo .word>span{display:inline-block}
.ng-logo.so-simbolo .word{display:none}
.ng-logo .ng-mid,.marca-dagua .ng-mid{fill:var(--logo-esc)}
.ng-logo .ng-mid .t-ar,.marca-dagua .ng-mid .t-ar{fill:var(--azul)}
.ng-logo.is-intro .ng-mid{animation:ng-surge .6s var(--ease) .75s both}
@keyframes ng-surge{from{opacity:0}to{opacity:1}}
.ng-logo.is-intro .wind{stroke-dashoffset:1;animation:ng-blow .95s var(--ease) forwards}
.ng-logo.is-intro .w2{animation-delay:.18s}.ng-logo.is-intro .w3{animation-delay:.36s}
.ng-logo.is-intro .word .ng{animation:ng-in .6s var(--ease) .9s both}
.ng-logo.is-intro .word .ar{animation:ng-in .7s var(--ease) 1.05s both}
.ng-logo.is-loading .wind{animation:ng-gust 1.8s var(--ease) infinite}
.ng-logo.is-loading .w2{animation-delay:.2s}.ng-logo.is-loading .w3{animation-delay:.4s}
@keyframes ng-blow{to{stroke-dashoffset:0}}
@keyframes ng-in{from{opacity:0;transform:translateX(-14px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@keyframes ng-gust{0%{stroke-dashoffset:1}45%{stroke-dashoffset:0}62%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
@media (prefers-reduced-motion:reduce){.ng-logo,.ng-logo *{animation:none!important}.ng-logo .wind{stroke-dashoffset:0!important}}

/* marca d'água: logo grande e apagado atrás de tudo */
.marca-dagua{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0;opacity:var(--marca-op);overflow:hidden}
.marca-dagua svg{width:min(118vmin,1100px);height:auto}
.marca-dagua path[fill="#2f4656"]{fill:var(--logo-esc)}
#tela-login,#tela-senha,#app{position:relative;z-index:1}

/* ===================== CARREGAMENTO ===================== */
#carregando{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:var(--fundo);transition:opacity .4s,visibility .4s}
#carregando.sumir{opacity:0;visibility:hidden}
#carregando .msg{margin-top:12px;color:var(--suave);font-size:13px;text-align:center}
.carregando-int{display:flex;flex-direction:column;align-items:center;gap:8px;padding:46px 10px;color:var(--suave);font-size:13px}
.carregando-int.peq{padding:16px 10px;flex-direction:row;justify-content:center}

/* ===================== LOGIN ===================== */
#tela-login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-caixa{width:min(400px,100%);background:var(--cartao);border:1px solid var(--linha);border-radius:20px;box-shadow:var(--sombra);padding:30px 26px 22px}
.login-caixa .topo{display:flex;justify-content:center;margin:4px 0 22px}
.login-caixa h1{font-size:18px;font-weight:700;margin:0 0 4px;color:var(--titulo)}
.login-caixa p.sub{margin:0 0 18px;color:var(--suave);font-size:13px}
.rodape-login{text-align:center;color:var(--suave);font-size:12px;margin-top:16px}

/* ===================== CAMPOS ===================== */
.campo{display:block;margin:0 0 14px}
.campo>span{display:block;font-size:12px;color:var(--suave);margin:0 0 5px;font-weight:700;letter-spacing:.01em}
.campo input,.campo select,.campo textarea,.entrada{width:100%;padding:11px 12px;border:1px solid var(--linha);border-radius:10px;background:var(--cartao);outline:none;min-height:44px}
.campo textarea{min-height:90px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus,.entrada:focus{border-color:var(--azul);box-shadow:0 0 0 3px #0aa6cd22}
.campo .info{padding:11px 12px;border-radius:10px;background:var(--cartao2);min-height:44px;color:var(--titulo);white-space:pre-wrap}
.senha-box{position:relative}.senha-box button{position:absolute;right:6px;top:6px;height:32px;border:0;background:none;color:var(--suave);cursor:pointer;font-size:12px}
.erro{color:var(--vermelho);font-size:13px;min-height:18px;margin:-4px 0 10px}
.alternar{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.alternar input{width:20px;height:20px;accent-color:var(--azul)}
.dois-campos{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:520px){.dois-campos{grid-template-columns:1fr}}
/* lista com busca */
.seletor{width:100%;min-height:44px;padding:11px 36px 11px 12px;border:1px solid var(--linha);border-radius:10px;background:var(--cartao);text-align:left;cursor:pointer;position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seletor::after{content:"";position:absolute;right:14px;top:18px;border:5px solid transparent;border-top-color:var(--suave)}
.seletor.vazio-sel{color:var(--suave)}
.painel-sel{position:fixed;z-index:80;background:var(--cartao);border:1px solid var(--linha);border-radius:14px;box-shadow:0 18px 50px #0004;display:flex;flex-direction:column;overflow:hidden}
.painel-sel input{border:0;border-bottom:1px solid var(--linha);padding:13px 14px;outline:none;background:var(--cartao)}
.painel-sel .ops{overflow:auto;max-height:300px}
.painel-sel .ops button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--linha)}
.painel-sel .ops button:hover,.painel-sel .ops button.foco{background:var(--azul-bg)}
.painel-sel .ops small{display:block;color:var(--suave);font-size:12px}
/* meses (despesas fixas) */
.meses{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:0 0 10px}
.meses label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border:1px solid var(--linha);border-radius:10px;font-size:12px;cursor:pointer;position:relative}
.meses input{width:18px;height:18px;accent-color:var(--verde)}
.meses label.marcado{background:var(--verde-bg);border-color:var(--verde-borda);color:var(--verde);font-weight:700}
.meses label.travado{opacity:.6;cursor:not-allowed}
.meses label.travado .icone{position:absolute;top:3px;right:3px;width:12px;height:12px}
.meses label.atual{outline:2px solid var(--azul);outline-offset:1px}

/* ===================== BOTÕES ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;min-height:44px;cursor:pointer;font-weight:700;background:var(--azul);color:#fff;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}.btn:disabled{opacity:.6;cursor:default}
.btn.sec{background:var(--cartao);color:var(--titulo);border:1px solid var(--linha)}
.btn.esc{background:#2f4656;color:#fff}.btn.perigo{background:var(--cartao);color:var(--vermelho);border:1px solid var(--vermelho-borda)}
.btn.verde{background:#1d9e75;color:#fff}.btn.zap{background:#25d366;color:#fff}
.btn.largo{width:100%}.btn.peq{min-height:36px;padding:7px 13px;font-size:13px}
.btn-icone{width:40px;height:40px;border-radius:50%;border:1px solid var(--linha);background:var(--cartao);display:grid;place-items:center;cursor:pointer;color:var(--titulo);position:relative;flex:none}
.btn-icone:hover{border-color:var(--linha-forte)}
.icone{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.segmento{display:flex;background:var(--cartao2);border:1px solid var(--linha);border-radius:999px;padding:3px;gap:2px}
.segmento button{flex:1;border:0;background:none;border-radius:999px;padding:8px 10px;cursor:pointer;font-size:13px;color:var(--suave);white-space:nowrap}
.segmento button.ativo{background:var(--cartao);color:var(--titulo);font-weight:700;box-shadow:0 1px 4px #0002}

/* ===================== ESTRUTURA ===================== */
#app{min-height:100vh}
.lateral{position:fixed;top:0;bottom:0;left:0;width:var(--lat);background:var(--cartao);border-right:1px solid var(--linha);display:flex;flex-direction:column;z-index:20;transition:width .25s var(--ease)}
html[data-lado="direita"] .lateral{left:auto;right:0;border-right:0;border-left:1px solid var(--linha)}
.lateral .cab-lat{display:flex;align-items:center;gap:6px;padding:14px 10px 8px 14px;min-height:64px}
.lateral .marca-lat{flex:1;overflow:hidden;min-width:0}
.lateral .recolher{border:0;background:none;width:36px;height:36px;border-radius:10px;cursor:pointer;color:var(--suave);display:grid;place-items:center;flex:none}
.lateral .recolher:hover{background:var(--cartao2)}
.lateral nav{flex:1;overflow:auto;padding:6px 10px 16px}
.grupo-nav{font-size:11px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.06em;margin:14px 10px 6px;white-space:nowrap;overflow:hidden}
.item-nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;color:var(--titulo);white-space:nowrap;overflow:hidden}
.item-nav:hover{background:var(--cartao2)}.item-nav.ativo{background:var(--azul-bg);color:var(--azul-esc);font-weight:700}
html[data-tema="escuro"] .item-nav.ativo{color:var(--azul)}
.principal{margin-left:var(--lat);min-height:100vh;display:flex;flex-direction:column;transition:margin .25s var(--ease)}
html[data-lado="direita"] .principal{margin-left:0;margin-right:var(--lat)}
/* menu recolhido: só os símbolos */
html.recolhido .lateral{width:var(--lat-rec)}
html.recolhido .principal{margin-left:var(--lat-rec)}
html.recolhido[data-lado="direita"] .principal{margin-left:0;margin-right:var(--lat-rec)}
html.recolhido .item-nav span,html.recolhido .grupo-nav{display:none}
html.recolhido .item-nav{justify-content:center;padding:12px 0}
html.recolhido .lateral .cab-lat{flex-direction:column;padding:12px 6px}
html.recolhido .lateral .marca-lat .word{display:none}
html.recolhido .lateral nav{padding:6px 8px}
html.recolhido .lateral nav .sep{height:1px;background:var(--linha);margin:8px 6px}
html.recolhido .lateral.aberta{width:var(--lat);box-shadow:0 0 40px #0003}
html.recolhido .lateral.aberta .item-nav span,html.recolhido .lateral.aberta .grupo-nav{display:block}
html.recolhido .lateral.aberta .item-nav{justify-content:flex-start;padding:10px 12px}
html.recolhido .lateral.aberta .cab-lat{flex-direction:row;padding:14px 10px 8px 14px}
html.recolhido .lateral.aberta .marca-lat .word{display:inline-flex}
html.recolhido .lateral.aberta nav .sep{display:none}
.lateral nav .sep{display:none}html.recolhido .lateral nav .sep{display:block}

.barra{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;padding:12px 22px;background:var(--barra);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.barra h2{font-size:18px;margin:0;flex:1;color:var(--titulo);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra .simb{display:none}
.chip-usuario{display:flex;align-items:center;gap:8px;border:1px solid var(--linha);background:var(--cartao);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--azul-bg);color:var(--azul-esc);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.contador{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#e24b4a;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--cartao)}
.conteudo{padding:20px 24px 40px;width:100%;max-width:1680px;margin:0 auto}
.inferior{display:none}

@media (max-width:899px){
  .lateral{display:none}
  .principal,html.recolhido .principal,html[data-lado="direita"] .principal,html.recolhido[data-lado="direita"] .principal{margin:0;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
  .barra{padding:10px 12px}.barra .simb{display:block}
  .chip-usuario .nome-chip{display:none}.chip-usuario{padding:4px}
  .conteudo{padding:14px 12px 24px}
  .inferior{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--cartao);border-top:1px solid var(--linha);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .inferior button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font-size:11px;color:var(--suave);padding:6px 0;cursor:pointer;border-radius:10px}
  .inferior button.ativo{color:var(--azul-esc);font-weight:700;background:var(--azul-bg)}
}

/* ===================== JANELAS ===================== */
.fundo-escuro{position:fixed;inset:0;background:#0a141899;z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:aparecer .2s}
.janela{background:var(--cartao);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:subir .28s var(--ease)}
.janela.larga{width:min(860px,100%)}
@media (min-width:700px){.fundo-escuro{align-items:center}.janela{border-radius:20px;padding:22px 24px}}
.janela .cab{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.janela .cab h3{margin:0;font-size:17px;flex:1;color:var(--titulo)}
.janela .cab .fechar{border:0;background:var(--cartao2);width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.janela .acoes{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:8px;position:sticky;bottom:-18px;background:var(--cartao);padding:10px 0 4px}
.janela .acoes .esq{margin-right:auto}
@keyframes aparecer{from{opacity:0}}@keyframes subir{from{transform:translateY(30px);opacity:0}}
.menu-modulos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu-modulos button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border:1px solid var(--linha);border-radius:14px;background:var(--cartao);cursor:pointer;font-size:12px;color:var(--titulo);text-align:center}
.menu-modulos button.ativo{border-color:var(--azul);background:var(--azul-bg)}
.menu-modulos .icone{width:26px;height:26px;color:var(--azul)}
.confirmar{background:var(--cartao2);border-radius:14px;padding:14px;margin:0 0 12px}
.confirmar .lin{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--linha);font-size:14px}
.confirmar .lin:last-child{border:0}.confirmar .lin span{color:var(--suave)}.confirmar .lin b{text-align:right;color:var(--titulo)}
.confirmar .grande{font-size:26px;font-weight:700;text-align:center;padding:6px 0 10px;color:var(--titulo)}
.nota{font-size:13px;color:var(--suave);margin:0 0 12px}
.preferencias{display:grid;gap:14px}
.preferencias .rot{font-size:12px;font-weight:700;color:var(--suave);margin:0 0 6px}

/* ===================== LISTAS E FILTROS ===================== */
.ferramentas{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.busca{flex:1;min-width:180px;position:relative}
.busca input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--linha);border-radius:999px;background:var(--cartao);min-height:44px;outline:none}
.busca .icone{position:absolute;left:12px;top:12px;color:var(--suave)}
.filtros{display:flex;gap:6px;overflow:auto;margin:0 0 12px;padding-bottom:2px;align-items:center}
.filtros select{border:1px solid var(--linha);background:var(--cartao);border-radius:999px;padding:7px 10px;font-size:13px;color:var(--titulo);cursor:pointer;max-width:200px;flex:none}
.filtros select.ligado{background:#2f4656;border-color:#2f4656;color:#fff}
.filtros .limpar{border:0;background:none;color:var(--azul-esc);font-size:13px;cursor:pointer;white-space:nowrap;flex:none}
.nav-mes{display:flex;align-items:center;gap:6px;margin:0 0 12px}
.nav-mes b{min-width:140px;text-align:center;color:var(--titulo);font-size:15px}
.nav-mes .todos{margin-left:auto;font-size:13px}
.lista{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.lista>*{min-width:0}
@media (min-width:900px){.lista{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{overflow:hidden;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s}
.card:hover{border-color:var(--linha-forte)}
.card .corpo{flex:1;min-width:0}
.card .t{font-weight:700;color:var(--titulo);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.card .t .icone{width:15px;height:15px;color:var(--suave)}
.card .s{color:var(--suave);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .dir{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.card .v{font-weight:700;color:var(--titulo)}
.card .id{font-size:11px;color:var(--suave)}
.card .acao-card{margin-top:4px}
.selo{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--cartao2);color:var(--titulo);white-space:nowrap;border:1px solid var(--linha)}
.selo.verde{background:var(--verde-bg);color:var(--verde);border-color:transparent}.selo.vermelho{background:var(--vermelho-bg);color:var(--vermelho);border-color:transparent}
.selo.ambar{background:var(--ambar-bg);color:var(--ambar);border-color:transparent}.selo.azul{background:var(--azul-bg);color:var(--azul-esc);border-color:transparent}
html[data-tema="escuro"] .selo.azul{color:var(--azul)}
.vazio{text-align:center;color:var(--suave);padding:40px 10px}
.contagem{color:var(--suave);font-size:12px;margin:0 0 8px}
.mini-meses{display:flex;gap:3px;margin-top:6px}
.mini-meses i{width:14px;height:6px;border-radius:3px;background:var(--linha)}.mini-meses i.p{background:var(--verde)}.mini-meses i.a{background:#e7a3a3}
/* ===================== PMOC > CHECKLISTS ===================== */
.cke-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cke-cartao{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);padding:14px;cursor:pointer;box-shadow:var(--sombra);transition:border-color .15s,transform .15s}
.cke-cartao:hover{border-color:var(--azul);transform:translateY(-1px)}
.cke-cartao b{font-size:16px;color:var(--titulo)}.cke-cartao span{color:var(--azul-esc);font-weight:700;font-size:13px}.cke-cartao small{color:var(--suave);font-size:12px}
html[data-tema="escuro"] .cke-cartao span{color:var(--azul)}
.cke-topo{display:flex;align-items:center;gap:12px;margin:0 0 6px}.cke-topo h3{margin:0;color:var(--titulo)}.cke-topo small{color:var(--suave)}
.cke-grupo{background:var(--cartao);border:1px solid var(--linha);border-radius:var(--raio);padding:10px 12px;margin:0 0 12px}
.cke-grupo h4{margin:2px 0 8px;color:var(--titulo);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.cke-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:8px 0;border-top:1px solid var(--linha)}
.cke-item:first-of-type{border-top:0}
.cke-item.desligado .cke-txt,.cke-item.desligado .cke-ops{opacity:.45}
.cke-txt{width:100%;min-width:0;margin:0;border:1px solid transparent;background:none;border-radius:8px;padding:7px 8px;font-size:14px}
.cke-txt:hover{border-color:var(--linha)}.cke-txt:focus{outline:0;border-color:var(--azul);background:var(--cartao2)}
.cke-ops{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cke-per{border:1px solid var(--linha-forte);background:var(--azul-bg);color:var(--azul-esc);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap}
html[data-tema="escuro"] .cke-per{color:var(--azul)}
.cke-resp button{padding:6px 10px}
.cke-un{width:130px;border:1px solid var(--linha);background:var(--cartao2);border-radius:8px;padding:6px 8px;font-size:13px}
.cke-lixo{border:0;background:none;color:var(--suave);cursor:pointer;padding:6px;border-radius:8px}.cke-lixo:hover{color:var(--vermelho);background:var(--vermelho-bg)}
.cke-lixo svg{width:18px;height:18px}
.cke-grupo>.btn{margin-top:8px}
/* banco de itens */
.bi-barra{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:899px){.bi-barra{grid-template-columns:1fr}}
.bi-tipos{margin:0 0 10px;min-height:1em}
.bi-item{display:flex;align-items:center;gap:12px;padding:9px 4px;border-top:1px solid var(--linha);cursor:pointer;border-radius:8px}
.cke-grupo h4+.bi-item{border-top:0}
.bi-item:hover{background:var(--cartao2)}
.bi-item input{width:20px;height:20px;accent-color:var(--azul);flex:none}
.bi-txt{flex:1;min-width:0;display:flex;flex-direction:column}.bi-txt small{color:var(--suave);font-size:12px}
.bi-item.tem{opacity:.5;cursor:default}
.bi-item .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--verde-bg);color:var(--verde);white-space:nowrap}
.dois-botoes{display:flex;gap:8px;flex-wrap:wrap}
.bi-grupo{padding:0;overflow:hidden}
.bi-cab{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;cursor:pointer;text-align:left}
.bi-cab b{flex:1;color:var(--titulo);text-transform:uppercase;letter-spacing:.04em;font-size:14px}.bi-cab span{color:var(--suave);font-size:13px}.bi-cab i{font-style:normal;color:var(--suave)}
.bi-cab:hover{background:var(--cartao2)}
.bi-corpo{padding:0 12px 12px;border-top:1px solid var(--linha)}
.bi-ed{grid-template-columns:minmax(0,1fr) auto}
@media (max-width:1180px){.bi-ed{grid-template-columns:1fr}.bi-ed .cke-ops{grid-column:1}}
/* chave liga/desliga */
.chave{position:relative;display:inline-block;width:42px;height:24px;flex:none;cursor:pointer}
.chave input{opacity:0;width:0;height:0;position:absolute}
.chave span{position:absolute;inset:0;background:var(--linha-forte);border-radius:999px;transition:background .2s}
.chave span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .2s var(--ease)}
.chave input:checked+span{background:var(--verde)}.chave input:checked+span::after{transform:translateX(18px)}
.chave input:focus-visible+span{outline:2px solid var(--azul);outline-offset:2px}
/* menu flutuante */
.menu-flut{position:fixed;z-index:9999;background:var(--cartao);border:1px solid var(--linha);border-radius:12px;box-shadow:0 10px 30px #0003;padding:6px;min-width:200px;animation:menu-in .14s var(--ease)}
.menu-flut button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.menu-flut button:hover{background:var(--cartao2)}.menu-flut button.ativo{background:var(--azul-bg)}
.menu-flut button b{color:var(--titulo)}.menu-flut button small{color:var(--suave)}
@keyframes menu-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (max-width:1180px){.cke-item{grid-template-columns:auto minmax(0,1fr)}.cke-ops{grid-column:2}}
@media (max-width:520px){.cke-ops{gap:6px}.cke-un{width:100%}}
.abas{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--linha);overflow:auto}
.abas button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--suave);font-weight:700;border-bottom:2px solid transparent;white-space:nowrap}
.abas button.ativo{color:var(--azul-esc);border-color:var(--azul)}
html[data-tema="escuro"] .abas button.ativo{color:var(--azul)}

/* ===================== RESUMOS E GRÁFICOS ===================== */
.resumo-tab{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 10px}
.kpi{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:12px 14px}
.kpi small{display:block;color:var(--suave);font-size:12px;font-weight:700}
.kpi b{display:block;font-size:20px;color:var(--titulo);margin-top:2px}
.kpi b.pos{color:var(--verde)}.kpi b.neg{color:var(--vermelho)}
.kpi em{font-style:normal;font-size:12px;color:var(--suave)}
.grafico{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:12px 14px 6px;margin:0 0 14px}
.grafico h4{margin:0 0 4px;font-size:13px;color:var(--titulo)}
.grafico svg{width:100%;height:auto;display:block}
.grafico svg text{fill:var(--suave);font-size:11px}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--suave);margin:2px 0 6px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.recolher-graf{border:0;background:none;color:var(--azul-esc);font-size:13px;cursor:pointer;padding:0;margin:0 0 10px}

/* ===================== PAINEL ===================== */
.saudacao{display:flex;align-items:flex-end;gap:10px;margin:0 0 16px;flex-wrap:wrap}
.saudacao b{font-size:21px;color:var(--titulo);display:block}.saudacao .cresce{flex:1 1 220px}.saudacao div{color:var(--suave);font-size:13px}
.atualizado{font-size:12px;color:var(--suave);display:flex;align-items:center;gap:6px}
.atualizado i{width:7px;height:7px;border-radius:50%;background:var(--verde)}
.atualizado.buscando i{background:var(--azul);animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.25}}
.area{margin:0 0 22px}
.area-cab{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.area-cab h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--suave);flex:1;display:flex;align-items:center;gap:8px}
.area-cab h3 .icone{width:17px;height:17px;color:var(--azul)}
.cartoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin:0 0 12px}
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:14px;cursor:pointer;position:relative;overflow:hidden}
.cartao::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--azul)}
.cartao.alerta.ligado::before{background:#e24b4a}
.cartao .r{font-size:12px;color:var(--suave);font-weight:700}
.cartao .n{font-size:26px;font-weight:700;color:var(--titulo);margin-top:2px}
.cartao.alerta.ligado .n{color:var(--vermelho)}
.bloco{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:14px;margin:0 0 14px}
.bloco h4{margin:0 0 10px;font-size:14px;color:var(--titulo)}
.linha-lista{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--linha);font-size:14px}
.linha-lista:first-of-type{border-top:0}.linha-lista .cresce{flex:1;min-width:0}
.linha-lista .cresce b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--titulo)}
.linha-lista small{color:var(--suave)}
.linha-lista.clica{cursor:pointer}
.lembrete{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--linha);border-radius:12px;background:var(--cartao);margin:0 0 8px;cursor:pointer}
.lembrete .bola{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--cartao2);color:var(--suave);flex:none}
.lembrete.vermelho .bola{background:var(--vermelho-bg);color:var(--vermelho)}.lembrete.ambar .bola{background:var(--ambar-bg);color:var(--ambar)}
.lembrete .cresce{flex:1;min-width:0}.lembrete b{display:block;font-size:14px;color:var(--titulo)}
.lembrete small{color:var(--suave);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lembrete .v{font-weight:700;color:var(--titulo);white-space:nowrap}
.duas-col{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:899px){.duas-col{grid-template-columns:minmax(0,1fr)}}
/* financeiro */
.fin-heroi{border-radius:18px;padding:18px 20px;color:#fff;background:linear-gradient(135deg,#0aa6cd 0%,#0b7fa0 45%,#2f4656 100%);position:relative;overflow:hidden;margin:0 0 10px}
.fin-heroi::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:#ffffff14}
.fin-heroi small{opacity:.85;font-size:12px;font-weight:700;letter-spacing:.03em}
.fin-heroi .saldo{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.15;margin:2px 0 12px}
.fin-heroi .linha{display:flex;gap:20px;flex-wrap:wrap;position:relative;z-index:1}
.fin-heroi .linha div{min-width:120px}.fin-heroi .linha b{display:block;font-size:17px}
.fin-grade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 10px}
@media (max-width:700px){.fin-grade{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fin-grade .kpi .seta{font-size:12px;font-weight:700}
html.fin-oculto .valor-fin{filter:blur(8px);user-select:none;transition:filter .2s}
.olho{border:1px solid var(--linha);background:var(--cartao);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--titulo);font-size:13px}
.barras-cat .b{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.barras-cat .b span{width:120px;color:var(--suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barras-cat .b i{height:10px;border-radius:5px;background:var(--graf-sai);display:block}
.barras-cat .b em{font-style:normal;color:var(--titulo);font-weight:700;margin-left:auto;white-space:nowrap}

/* ===================== PONTO ===================== */
.relogio{background:linear-gradient(135deg,#2f4656,#1b2e37);color:#fff;border-radius:20px;padding:22px;text-align:center;margin:0 0 14px}
.relogio .hora{font-size:52px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.relogio .dia{opacity:.8;font-size:14px;margin-bottom:16px}
.relogio .btn{background:var(--azul);font-size:17px;padding:16px 26px;min-height:58px;width:min(340px,100%)}
.marcas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.marca{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:10px 6px;text-align:center}
.marca small{display:block;color:var(--suave);font-size:11px}.marca b{font-size:18px;color:var(--titulo)}
.marca.feita{border-color:var(--verde-borda);background:var(--verde-bg)}.marca.feita b{color:var(--verde)}
.resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.resumo div{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:10px;text-align:center}
.resumo small{display:block;color:var(--suave);font-size:11px}.resumo b{font-size:17px;color:var(--titulo)}
@media (max-width:480px){.marcas,.resumo{grid-template-columns:repeat(2,1fr)}.relogio .hora{font-size:44px}}

/* ===================== PRESENÇA ===================== */
.pres{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:12px 14px;margin:0 0 8px}
.pres .topo{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.pres .topo .cresce{flex:1;min-width:0}.pres .topo b{display:block;color:var(--titulo)}.pres .topo small{color:var(--suave)}
.pres .opcoes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pres .opcoes button{border:1px solid var(--linha);background:var(--cartao);border-radius:10px;padding:9px 4px;cursor:pointer;font-size:13px;color:var(--titulo)}
.pres .opcoes button.on[data-p="Presente"]{background:var(--verde-bg);border-color:var(--verde-borda);color:var(--verde);font-weight:700}
.pres .opcoes button.on[data-p="Meia diária"]{background:var(--azul-bg);border-color:var(--azul);color:var(--azul-esc);font-weight:700}
.pres .opcoes button.on[data-p="Falta"]{background:var(--vermelho-bg);border-color:var(--vermelho-borda);color:var(--vermelho);font-weight:700}
.pres .opcoes button.on[data-p="Folga"]{background:var(--ambar-bg);border-color:transparent;color:var(--ambar);font-weight:700}
.pres .extras{display:grid;grid-template-columns:120px 1fr;gap:6px;margin-top:8px}
.pres .extras input{min-height:38px;padding:8px 10px}
.pres .por{font-size:11px;color:var(--suave);margin-top:6px}
.barra-salvar{position:sticky;bottom:0;padding:10px 0;background:linear-gradient(transparent,var(--fundo) 30%);display:flex;gap:8px;justify-content:flex-end;z-index:5}
@media (max-width:899px){.barra-salvar{bottom:calc(68px + env(safe-area-inset-bottom))}}
.tabela{width:100%;border-collapse:collapse;font-size:13px}
.tabela th{text-align:left;color:var(--suave);font-weight:700;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--linha);white-space:nowrap}
.tabela td{padding:9px 6px;border-bottom:1px solid var(--linha);vertical-align:top}
.tabela td.n{text-align:right;white-space:nowrap}.tabela tfoot td{font-weight:700;color:var(--titulo);border:0}
.rolavel{overflow:auto}

/* ===================== SERVIÇO (detalhe e agenda) ===================== */
.os{background:var(--cartao);border:1px solid var(--linha);border-radius:16px;padding:14px;margin:0 0 10px}
.os .topo{display:flex;gap:8px;align-items:flex-start}
.os .topo .cresce{flex:1;min-width:0}
.os h4{margin:0;font-size:16px;color:var(--titulo)}
.os .meta{color:var(--suave);font-size:13px;margin-top:2px}
.desc{white-space:pre-wrap;font-size:14px;margin:10px 0;color:var(--texto);background:var(--cartao2);border-radius:10px;padding:10px;max-height:240px;overflow:auto}
.os .contato,.det-contato{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.os .botoes,.janela .botoes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.anexos{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.anexo{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--linha-forte);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;background:none;color:var(--titulo);text-decoration:none}
.anexo .icone{width:16px;height:16px}
.det-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.det-info div{background:var(--cartao2);border-radius:10px;padding:8px 10px}.det-info small{display:block;color:var(--suave);font-size:11px}.det-info b{color:var(--titulo);font-size:14px}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin:8px 0}
.galeria a{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--cartao2);position:relative;text-decoration:none}
.galeria img{width:100%;height:100%;object-fit:cover}
.galeria a span{position:absolute;left:4px;bottom:4px;font-size:10px;background:#000a;color:#fff;border-radius:6px;padding:1px 6px}
.galeria a .nome{display:grid;place-items:center;height:100%;font-size:11px;color:var(--suave);padding:6px;text-align:center}
.assinatura{width:100%;height:200px;border:1.5px dashed var(--linha-forte);border-radius:12px;background:#fff;touch-action:none}
.mat{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--linha)}
.mat .cresce{flex:1;min-width:0}.mat b{display:block;color:var(--titulo)}.mat small{color:var(--suave)}
.mat button{border:0;background:var(--vermelho-bg);color:var(--vermelho);width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.add-mat{background:var(--cartao2);border-radius:14px;padding:12px;margin-top:12px}
.add-mat .linha{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:end}

/* ===================== USUÁRIOS ===================== */
.usuario{display:flex;gap:12px;align-items:center;background:var(--cartao);border:1px solid var(--linha);border-radius:16px;padding:14px;cursor:pointer;position:relative;overflow:hidden}
.usuario:hover{border-color:var(--linha-forte)}
.usuario .foto{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;flex:none;position:relative}
.usuario .foto i{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;border:3px solid var(--cartao);background:#1d9e75}
.usuario.inativo .foto{filter:grayscale(1);opacity:.6}.usuario.inativo .foto i{background:#a3a3a3}
.usuario .cresce{flex:1;min-width:0}
.usuario .nome{font-weight:700;color:var(--titulo);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usuario .login{color:var(--suave);font-size:13px}
.usuario .det{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.usuario .det span.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--suave)}
.usuario .det .icone{width:14px;height:14px}
.usuario .ultimo{font-size:11px;color:var(--suave);text-align:right;flex:none;max-width:110px}
.grade-mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin:0 0 14px}
.grade-mods label{display:flex;gap:8px;align-items:center;border:1px solid var(--linha);border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer}
.grade-mods label .icone{width:16px;height:16px;color:var(--azul)}
.grade-mods label.do-perfil{background:var(--cartao2);color:var(--suave)}
.grade-mods input{accent-color:var(--azul)}
.log{font-size:12px;width:100%;border-collapse:collapse}.log td{border-top:1px solid var(--linha);padding:6px 4px;vertical-align:top;word-break:break-word}
.log tr.err td{color:var(--vermelho)}
.aviso-senha{background:var(--ambar-bg);color:var(--ambar);border-radius:12px;padding:12px;margin:10px 0;font-size:14px}

/* ---------- servidor ---------- */
function chamar(fn, ...args) {
  return new Promise((ok, falha) => {
    if (!window.google || !google.script) { falha(new Error('Abra pelo link do sistema.')); return; }
    google.script.run.withSuccessHandler(ok).withFailureHandler(falha)[fn](...args);
  });
}
async function api(acao, dados) {
  let r;
  if (!(dados && dados._auto)) E.ultimaAtividade = Date.now();
  try { r = await chamar('chamarApi', acao, E.token, dados || {}); }
  catch (e) { throw new Error('Sem conexão com o servidor. Confira a internet e tente de novo.'); }
  if (!r.ok) {
    if (r.sessao) { sair(true); throw new Error(r.erro); }
    throw new Error(r.erro);
  }
  return r.dados;
}
async function comBotao(btn, fn) {
  const t = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="girando"></span>';
  try { return await fn(); } catch (e) { aviso(e.message, 'erro'); } finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = t; } }
}

/* Botão que abre um PDF/arquivo do Drive dentro do sistema (sem sair para o Drive). */
const botaoVer = (url, html, classe) => '<button type="button" class="' + (classe || 'btn sec peq') + '" data-verpdf="' + esc(url) + '">' + html + '</button>';
document.addEventListener('click', e => { const b = e.target.closest('[data-verpdf]'); if (!b) return; e.preventDefault(); e.stopPropagation(); verPdf(b.dataset.verpdf); }, true);
function idDrive(url) { const m = String(url || '').match(/\/d\/([\w-]+)|[?&]id=([\w-]+)|folders\/([\w-]+)/); return m ? (m[1] || m[2] || m[3]) : ''; }
function verPdf(url) {
  const id = idDrive(url);

}

async function sair(silencioso) {
  const t = E.token;
  if (E.ctx) { try { Object.keys(localStorage).filter(k => k.indexOf('ngT:' + E.ctx.login + ':') === 0 || k.indexOf('ngPainel:') === 0).forEach(k => localStorage.removeItem(k)); } catch (e) { } }
  E.token = null; E.ctx = null; E.cache = {}; E.pre = {}; MEM.gravar('ngToken', null); MEM.gravar('ngCtx', null);
  if (t && !silencioso) chamar('logout', t).catch(() => { });
  $$('.fundo-escuro, .painel-sel').forEach(x => x.remove());
  $('#l-senha').value = '';
  mostrarLogin(silencioso ? 'Sua sessão terminou. Entre novamente.' : '');

/* ---------- início ---------- */
function pararTimers() { E.timers.forEach(clearInterval); E.timers = []; }
async function iniciar(ctxPronto) {
  carregando('Preparando seu acesso…');
  if (ctxPronto) E.ctx = ctxPronto;
  else {
    // Abre na hora com o que ficou guardado da última vez; o servidor confere a sessão em seguida.
    let guard = null; try { guard = JSON.parse(MEM.ler('ngCtx') || 'null'); } catch (e) { }
    if (guard && guard.sessao && Date.now() < guard.sessao.fimMax) {
      E.ctx = guard;
      api('contexto', { _auto: true }).then(c => { E.ctx = c; MEM.gravar('ngCtx', JSON.stringify(c)); if (JSON.stringify(c.modulos) !== JSON.stringify(guard.modulos)) { montarMenus(); } }).catch(() => { });
    } else {
      try { E.ctx = await api('contexto'); }
      catch (e) { if (E.token) mostrarLogin(e.message); return; }
    }
  }
  MEM.gravar('ngCtx', JSON.stringify(E.ctx));
  if (E.ctx.trocarSenha) { mostrarTrocaObrigatoria(''); return; }
  $('#tela-login').classList.add('oculto'); $('#tela-senha').classList.add('oculto'); $('#app').classList.remove('oculto');
  MEM.gravar('ngFinVer', null); aplicarOlho(); // toda vez que abre o sistema, os valores começam escondidos
  setTimeout(pedirAceite, 700); // primeiro acesso: aviso de registro das ações
  logoLateral = criarLogo($('#logo-lateral'), .34); logoLateral.intro(); criarLogo($('#logo-barra'), .32, true).intro();
  const ini = (E.ctx.nome || '?').trim().split(/\s+/); $('#avatar').textContent = (ini[0][0] + (ini[1] ? ini[1][0] : '')).toUpperCase();
  $('#avatar').style.background = corDe(E.ctx.login); $('#avatar').style.color = '#fff';
  $('#nome-chip').textContent = E.ctx.nome.split(' ')[0];
  $('#sino').innerHTML = ic('sino');
  montarMenus();
  const inicio = (location.hash || '').slice(1);
  abrir(E.ctx.modulos.some(m => m.id === inicio) ? inicio : E.ctx.modulos[0] && E.ctx.modulos[0].id);
  pronto();
  pararTimers();
  setTimeout(preCarregar, 1200);
  buscarNotificacoes(); E.timers.push(setInterval(buscarNotificacoes, 60000));
  E.timers.push(setInterval(conferirSessao, 30000));
}
/* ---------- pré-carregamento: busca as telas do usuário em segundo plano, numa chamada só ---------- */
const chaveTab = tab => 'ngT:' + E.ctx.login + ':' + tab;
function guardarTab(tab, dados) { E.pre = E.pre || {}; E.pre[tab] = { dados, quando: Date.now() }; const t = JSON.stringify(dados); if (t.length < 700000) MEM.gravar(chaveTab(tab), t); }
function tabGuardada(tab) {
  E.pre = E.pre || {};
  if (E.pre[tab]) return E.pre[tab].dados;
  try { const t = MEM.ler(chaveTab(tab)); if (t) { const d = JSON.parse(t); E.pre[tab] = { dados: d, quando: 0 }; return d; } } catch (e) { }
  return null;
}
async function preCarregar() {
  if (!E.ctx) return;
  const tabs = [];
  E.ctx.modulos.forEach(m => [m.tabela].concat(m.tabelas || []).filter(Boolean).forEach(t => tabs.push(t)));

/* ---------- campos de formulário ---------- */
function campoHTML(c, valor, opcoes) {
  const v = valor == null ? '' : valor, nome = esc(c.c), rot = esc(c.rotulo || c.c) + (c.obrig ? ' *' : '');
  switch (c.t) {
    case 'senha': return '<label class="campo"><span>' + rot + '</span><input type="password" data-c="' + nome + '" autocomplete="off"></label>';
    case 'area': return '<label class="campo"><span>' + rot + '</span><textarea data-c="' + nome + '">' + esc(v) + '</textarea></label>';
    case 'data': return '<label class="campo"><span>' + rot + '</span><input type="date" data-c="' + nome + '" value="' + esc(v) + '"></label>';
    case 'hora': return '<label class="campo"><span>' + rot + '</span><input type="time" data-c="' + nome + '" value="' + esc(v) + '"></label>';
    case 'dinheiro': case 'numero': return '<label class="campo"><span>' + rot + '</span><input inputmode="decimal" data-c="' + nome + '" data-t="num" value="' + esc(v === '' ? '' : String(v).replace('.', ',')) + '" placeholder="' + (c.t === 'dinheiro' ? '0,00' : '') + '"></label>';
    case 'bool': return '<label class="campo alternar"><input type="checkbox" data-c="' + nome + '" data-t="bool"' + (v === true ? ' checked' : '') + '><span style="margin:0;font-size:14px;color:var(--texto)">' + rot + '</span></label>';
    case 'simnao': opcoes = ['Sim', 'Não']; // continua em lista
    case 'lista': {
      const ops = (opcoes || []).slice(); if (v && ops.indexOf(v) < 0) ops.unshift(v);
      return '<label class="campo"><span>' + rot + '</span><select data-c="' + nome + '"' + (ops.length > 8 ? ' data-busca="1"' : '') + '><option value=""></option>' +
        ops.map(o => '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></label>';
    }
    case 'info': {
      if (v === '' || v == null) return '';
      const txt = c.tipoInfo === 'dinheiro' && typeof v === 'number' ? dinheiro(v) : c.tipoInfo === 'data' ? dataBR(v) : v;
      return '<div class="campo"><span>' + rot + '</span><div class="info">' + esc(txt) + '</div></div>';
    }
    case 'link': return v ? '<div class="campo"><span>' + rot + '</span><div class="info">' + (/folders\//.test(v) ? fora(v, ic('clipe') + 'Abrir pasta no Drive', 'anexo') : botaoVer(v, ic('pdf') + 'Ver ' + esc(String(c.c).toLowerCase()), 'anexo')) + '</div></div>' : '';
    default: return '<label class="campo"><span>' + rot + '</span><input data-c="' + nome + '" value="' + esc(v) + '"' + (c.tel ? ' type="tel" inputmode="tel"' : '') + '></label>';
  }
}
function lerCampos(el) {
  const o = {};
  $$('[data-c]', el).forEach(i => {
    if (i.dataset.t === 'bool') o[i.dataset.c] = i.checked;
    else if (i.dataset.t === 'num') o[i.dataset.c] = i.value.trim() === '' ? '' : Number(i.value.replace(/\./g, '').replace(',', '.'));
    else o[i.dataset.c] = i.value;
  });
  return o;
}
/* Listas grandes viram "lista com busca": toca, digita parte do nome e escolhe. */
function melhorarListas(raiz, extras) {
  $$('select[data-c]', raiz).forEach(sel => { const ex = extras && extras[sel.dataset.c]; if (!sel.dataset.feito && (sel.dataset.busca || ex)) seletorBusca(sel, ex); });
}
function seletorBusca(sel, extras) {
  sel.dataset.feito = 1; sel.style.display = 'none';
  const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'seletor';
  const pintar = () => { bt.textContent = sel.value || 'Toque para escolher'; bt.classList.toggle('vazio-sel', !sel.value); };
  pintar(); sel.after(bt);
  sel.addEventListener('change', pintar);
  bt.onclick = () => {
    $$('.painel-sel').forEach(x => x.remove());
    const r = bt.getBoundingClientRect(), p = document.createElement('div'); p.className = 'painel-sel';
    const alto = Math.min(380, window.innerHeight - 20), cabe = window.innerHeight - r.bottom > alto + 8;
    Object.assign(p.style, { left: Math.max(8, Math.min(r.left, window.innerWidth - Math.max(r.width, 260) - 8)) + 'px', width: Math.max(r.width, 260) + 'px',
      top: (cabe ? r.bottom + 4 : Math.max(8, r.top - alto - 4)) + 'px', maxHeight: alto + 'px' });
    const ops = Array.from(sel.options).filter(o => o.value).map(o => ({ v: o.value, d: (extras && extras[o.value]) || '' }));
    p.innerHTML = '<input placeholder="Digite para buscar…"><div class="ops"></div>';
    document.body.appendChild(p);
    const inp = $('input', p), lista = $('.ops', p);
    const desenhar = () => {
      const q = normal(inp.value);
      const f = ops.filter(o => !q || normal(o.v + ' ' + o.d).indexOf(q) >= 0).slice(0, 200);
      lista.innerHTML = (sel.value ? '<button data-v="">— limpar —</button>' : '') + (f.length ? f.map(o => '<button data-v="' + esc(o.v) + '">' + esc(o.v) + (o.d ? '<small>' + esc(o.d) + '</small>' : '') + '</button>').join('') : '<div class="vazio" style="padding:14px">Nada encontrado.</div>');
      $$('button', lista).forEach(b => b.onclick = () => { sel.value = b.dataset.v; sel.dispatchEvent(new Event('change')); p.remove(); });
    };
    inp.oninput = desenhar; desenhar(); setTimeout(() => inp.focus(), 30);
    inp.onkeydown = e => { if (e.key === 'Enter') { const b = $('.ops button[data-v]:not([data-v=""])', p); if (b) b.click(); e.preventDefault(); } if (e.key === 'Escape') p.remove(); };
    setTimeout(() => document.addEventListener('mousedown', function fora(e) { if (!p.contains(e.target)) { p.remove(); document.removeEventListener('mousedown', fora); } }), 0);
  };
}

/* ===================== GRÁFICOS SIMPLES (SVG) ===================== */
function grafBarras(series, nomes, cores) {
  const W = 640, H = 190, mL = 44, mB = 26, mT = 10, n = series.length, k = nomes.length;
  const max = Math.max(1, ...series.flatMap(s => s.v)) * 1.1;
  const g = (W - mL) / n, bw = Math.min(26, (g - 14) / k);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  for (let i = 0; i <= 3; i++) { const y = mT + (H - mT - mB) * i / 3; s += '<line x1="' + mL + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--linha)"/><text x="' + (mL - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + curto(max * (1 - i / 3)) + '</text>'; }
  series.forEach((sr, i) => {
    const x0 = mL + g * i + (g - bw * k - 4 * (k - 1)) / 2;
    sr.v.forEach((v, j) => { const h = (H - mT - mB) * v / max; s += '<rect x="' + (x0 + j * (bw + 4)) + '" y="' + (H - mB - h) + '" width="' + bw + '" height="' + Math.max(0, h) + '" rx="3" fill="' + cores[j] + '"><title>' + esc(sr.r + ' · ' + nomes[j] + ': ' + dinheiro(v)) + '</title></rect>'; });
    s += '<text x="' + (mL + g * i + g / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(sr.r) + '</text>';
  });
  return s + '</svg>';
}
function grafLinha(pontos, cor) {
  if (pontos.length < 2) return '<div class="vazio" style="padding:20px">Poucos dados para o gráfico.</div>';
  const W = 640, H = 170, mL = 44, mB = 24, mT = 10;
  const vs = pontos.map(p => p.v), max = Math.max(...vs) * 1.1 || 1, min = Math.min(0, ...vs);
  const X = i => mL + (W - mL - 10) * i / (pontos.length - 1), Y = v => mT + (H - mT - mB) * (1 - (v - min) / (max - min));
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '">';
  for (let i = 0; i <= 3; i++) { const v = min + (max - min) * (1 - i / 3), y = Y(v); s += '<line x1="' + mL + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--linha)"/><text x="' + (mL - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + curto(v) + '</text>'; }
  const d = pontos.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  s += '<path d="' + d + ' L' + X(pontos.length - 1) + ' ' + (H - mB) + ' L' + mL + ' ' + (H - mB) + 'Z" fill="' + cor + '" opacity=".12"/><path d="' + d + '" fill="none" stroke="' + cor + '" stroke-width="2.5"/>';
  const passo = Math.ceil(pontos.length / 6);
  pontos.forEach((p, i) => { if (i % passo === 0 || i === pontos.length - 1) s += '<text x="' + X(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(p.r) + '</text>'; s += '<circle cx="' + X(i) + '" cy="' + Y(p.v) + '" r="3" fill="' + cor + '"><title>' + esc(p.r + ': ' + dinheiro(p.v)) + '</title></circle>'; });
  return s + '</svg>';
}

/* ===================== TELA GENÉRICA DE TABELA ===================== */
async function telaTabela(tab, manter, alvo) {

function montarTabela(tab, dados, area, est, alvo) {

    if (f === '_pago') return { f, rot: 'Pagamento', ops: ['Confirmado', 'Em aberto'], teste: (l, v) => !!l['Pago?'] === (v === 'Confirmado') };
    const ops = Array.from(new Set(dados.linhas.map(l => l[f]).filter(x => x !== '' && x != null).map(String))).sort((a, b) => a.localeCompare(b, 'pt-BR'));
    return { f, rot: f.replace('?', ''), ops, teste: (l, v) => String(l[f]) === v };

    const g = todas.filter(l => l['Guardei ou tirei'] === 'Guardei').reduce((t, l) => t + num(l['Valor']), 0), t = todas.filter(l => l['Guardei ou tirei'] === 'Tirei').reduce((s, l) => s + num(l['Valor']), 0);

/* Pergunta dentro do sistema (no lugar da janelinha do navegador). Devolve true/false. */
function perguntar(titulo, texto, txtSim, perigo) {
  return new Promise(ok => {
    let resp = false;
    const j = janela(titulo, '<p style="margin:0 0 6px;font-size:15px;white-space:pre-line">' + esc(texto) + '</p>', [{ txt: 'Cancelar', classe: 'sec', fn: () => j.fechar() },
      { txt: txtSim || 'Confirmar', classe: perigo ? 'perigo' : '', fn: () => { resp = true; j.fechar(); } }], 'pequena');
    const obs = new MutationObserver(() => { if (!j.el.isConnected) { obs.disconnect(); ok(resp); } });
    obs.observe(document.body, { childList: true });
  });
}

async function telaPainel() {
  const vez = E.vez, area = $('#conteudo');
  const h = new Date().getHours(), saud = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  area.innerHTML = '<div class="saudacao"><div class="cresce"><b>' + saud + ', ' + esc(E.ctx.nome.split(' ')[0]) + '</b><div>' +
    new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }) + '</div></div><div class="atualizado" id="p-at"><i></i><span></span></div></div><div id="p-corpo"></div>';
  const chave = 'ngPainel:' + E.ctx.login, guardado = MEM.ler(chave);
  if (guardado) { try { desenharPainel(JSON.parse(guardado), true); } catch (e) { carregarEm($('#p-corpo')); } } else carregarEm($('#p-corpo'), 'Montando o painel…');
  const buscar = async auto => {
    if (!viva(vez) || (auto && document.hidden)) return;
    $('#p-at').classList.add('buscando');
    try { const d = await api('painel', auto ? { _auto: true } : {}); if (!viva(vez)) return; MEM.gravar(chave, JSON.stringify(d)); desenharPainel(d, false); }
    catch (e) { if (!guardado && viva(vez)) $('#p-corpo').innerHTML = '<div class="vazio">' + esc(e.message) + '</div>'; }
    finally { const a = $('#p-at'); if (a) a.classList.remove('buscando'); }
  };
  buscar(false);
  const t = setInterval(() => { if (!viva(vez)) return clearInterval(t); buscar(true); }, 15000);
}

/* ---------- serviço: cartão, ações e detalhe ---------- */
const concluido = s => normal(s['Situação']) === 'concluido';
function blocoContato(s) {
  const c = s._cliente || {};
  return '<div class="det-contato">' + (c.tel ? '<a class="btn sec peq" href="tel:' + esc(String(c.tel).replace(/\D/g, '')) + '">' + ic('telefone') + 'Ligar</a>' + fora(linkZap(c.tel, 'Olá! Aqui é da NG Ar Condicionado, sobre o serviço ' + s._id + '.'), ic('zap') + 'WhatsApp') : '') +
    (c.end ? fora('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.end), ic('mapa') + 'Mapa') : '') + '</div>';
}
const assinado = s => /Assinado por/.test(s['Descrição'] || '') || (E.fila || []).some(t => t.os === s._id && t.tipo === 'assinatura');
function blocoAnexos(s) {
  const a = [];
  if (s['Pasta / fotos'] || pendentesOS(s._id)) a.push('<button class="anexo" data-a="anexos">' + ic('clipe') + 'Fotos e assinatura' + (pendentesOS(s._id) ? ' · enviando ' + pendentesOS(s._id) : '') + '</button>');
  if (s['Comprovante']) a.push(botaoVer(s['Comprovante'], ic('pdf') + 'Comprovante', 'anexo'));
  return a.length ? '<div class="anexos">' + a.join('') + '</div>' : '';
}
/* ícones de situação no cartão: assinatura colhida, comprovante gerado, fotos */
function iconesOS(s) {
  return '<span class="ic-os">' + (assinado(s) ? '<i title="Assinado" class="ok">' + ic('caneta') + '</i>' : '<i title="Sem assinatura">' + ic('caneta') + '</i>') +
    (s['Comprovante'] ? '<i title="Comprovante gerado" class="ok">' + ic('pdf') + '</i>' : '') + (s['Pasta / fotos'] ? '<i title="Tem fotos" class="ok">' + ic('foto') + '</i>' : '') + '</span>';
}
function botoesOS(s) {
  if (concluido(s)) return '<div class="botoes"><button class="btn" data-a="comprovante">' + ic('pdf') + 'Comprovante</button><button class="btn sec" data-a="reabrir">Reabrir</button></div>';
  return '<div class="botoes">' + (s['Situação'] !== 'Em andamento' ? '<button class="btn esc" data-a="iniciar">' + ic('play') + 'Iniciar</button>' : '<button class="btn" data-a="concluir">' + ic('ok') + 'Concluir</button>') +
    '<button class="btn sec" data-a="fotos">' + ic('foto') + 'Fotos</button><button class="btn sec" data-a="assinar">' + ic('caneta') + (assinado(s) ? 'Assinado ✓' : 'Assinatura') + '</button>' +
    '<button class="btn sec" data-a="materiais">' + ic('material') + 'Materiais</button><button class="btn sec" data-a="obs"' + (s._pmoc ? '' : ' style="grid-column:1/-1"') + '>' + ic('editar') + 'Anotar</button>' +
    (s._pmoc ? '<button class="btn esc" data-a="pmoc" style="grid-column:1/-1">' + ic('check') + 'Checklist PMOC</button>' : '') + '</div>';
}
function cartaoOS(s) {
  const c = s._cliente || {}, atrasado = !concluido(s) && s['Agendado para'] && s['Agendado para'] < hojeISO();
  return '<div class="os" data-id="' + esc(s._id) + '"><div class="topo"><div class="cresce"><h4>' + esc(s['Cliente']) + '</h4><div class="meta">' + esc([s._id, s['Tipo'], s['Agendado para'] ? dataBR(s['Agendado para']) : 'sem data'].filter(Boolean).join(' · ')) + '</div></div>' +
    iconesOS(s) + selo(atrasado ? 'Atrasado' : s['Situação']) + '</div>' +
    (c.end || c.contato ? '<div class="meta" style="margin-top:6px">' + esc([c.end, c.contato ? 'Contato: ' + c.contato : ''].filter(Boolean).join(' · ')) + '</div>' : '') +
    (s['Descrição'] ? '<div class="desc">' + esc(s['Descrição']) + '</div>' : '') + (concluido(s) ? '' : blocoContato(s)) + blocoAnexos(s) + botoesOS(s) + '</div>';
}
function ligarAcoesOS(raiz, achar, recarregar) {
  $$('[data-a]', raiz).forEach(b => b.onclick = () => {
    const s = achar(b.closest('[data-id]').dataset.id), a = b.dataset.a;
    acaoOS(s, a, b, recarregar);

/* ===================== ENVIOS EM SEGUNDO PLANO =====================
 * Fotos, assinaturas e comprovantes vão para uma fila. A pessoa segue trabalhando enquanto envia.
 * Ao concluir o serviço, o sistema espera a fila daquele serviço terminar. */
E.fila = [];
const pendentesOS = os => E.fila.filter(t => t.os === os && !t.feito).length;
function enfileirar(tarefa) {
  tarefa.feito = false; tarefa.tentativas = 0;
  tarefa.promessa = new Promise(ok => { tarefa.fim = ok; });
  E.fila.push(tarefa); pintarFila(); rodarFila();
  return tarefa.promessa;
}
let filaRodando = false;
async function rodarFila() {
  if (filaRodando) return; filaRodando = true;
  try {
    for (let t = E.fila.find(x => !x.feito); t; t = E.fila.find(x => !x.feito)) {
      try { await api(t.acao, t.dados); t.feito = true; t.fim(true); if (t.depois) t.depois(); }
      catch (e) {
        t.tentativas++;
        if (t.tentativas >= 3) { t.feito = true; t.erro = e.message; t.fim(false); aviso('Não consegui enviar: ' + t.rotulo + '. ' + e.message, 'erro'); }
        else await new Promise(r => setTimeout(r, 2500));
      }
      pintarFila();
    }
  } finally { filaRodando = false; E.fila = E.fila.filter(x => !x.feito); pintarFila(); }
}
function esperarFila(os) { return Promise.all(E.fila.filter(t => t.os === os && !t.feito).map(t => t.promessa)); }
function pintarFila() {
  let el = $('#fila');
  const n = E.fila.filter(t => !t.feito).length;
  if (!el) { el = document.createElement('div'); el.id = 'fila'; el.className = 'fila'; $('.barra').insertBefore(el, $('#sino')); }
  el.innerHTML = n ? '<span class="girando"></span>Enviando ' + n + '…' : '';
  el.style.display = n ? '' : 'none';
}
window.addEventListener('beforeunload', e => { if (E.fila.some(t => !t.feito)) { e.preventDefault(); e.returnValue = ''; } });

/* ===================== ARQUIVOS (fotos, assinaturas, comprovantes, contratos) ===================== */
function comprimir(arquivo, max) {
  return new Promise((ok, falha) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, (max || 1600) / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .72)); };
      img.onerror = () => falha(new Error('Não consegui ler a imagem.')); img.src = r.result; };
    r.onerror = () => falha(new Error('Não consegui ler o arquivo.')); r.readAsDataURL(arquivo);
  });
}
const lerBase64 = arq => new Promise((ok, falha) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => falha(new Error('Não consegui ler o arquivo.')); r.readAsDataURL(arq); });

  carregar();
}

/* ---------- assinatura: tela cheia, sempre deitada (mais espaço para assinar) ---------- */
function janelaAssinatura(s, depois) {
  const v = document.createElement('div'); v.className = 'tela-assinatura';
  v.innerHTML = '<div class="giro"><div class="cab-ass"><input id="as-nome" placeholder="Nome de quem está assinando" autocomplete="off"><button class="btn sec peq" id="as-limpar">Limpar</button>' +
    '<button class="btn sec peq" id="as-cancelar">Cancelar</button><button class="btn peq" id="as-ok">' + ic('ok') + 'Salvar</button></div><canvas id="as-tela"></canvas><div class="dica-ass">Assine com o dedo dentro do quadro</div></div>';
  document.body.appendChild(v);
  try { if (document.documentElement.requestFullscreen && window.innerWidth < 900) document.documentElement.requestFullscreen().then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => { })).catch(() => { }); } catch (e) { }
  const giro = $('.giro', v), cv = $('#as-tela', v), ctx = cv.getContext('2d');
  let girado = false, desenhando = false, desenhou = false;
  const ajustar = () => {
    girado = window.innerHeight > window.innerWidth;   // celular em pé: gira a área de assinatura 90°
    giro.classList.toggle('girado', girado);
    const W = girado ? window.innerHeight : window.innerWidth, H = girado ? window.innerWidth : window.innerHeight;
    giro.style.width = W + 'px'; giro.style.height = H + 'px';
    const r = cv.getBoundingClientRect(), k = window.devicePixelRatio || 1;
    const cw = girado ? r.height : r.width, ch = girado ? r.width : r.height;
    const copia = desenhou ? cv.toDataURL() : null;
    cv.width = cw * k; cv.height = ch * k; ctx.setTransform(k, 0, 0, k, 0, 0); ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d2f37';
    if (copia) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, cw, ch); im.src = copia; }
  };
  setTimeout(ajustar, 60); window.addEventListener('resize', ajustar);
  const pos = e => { const r = cv.getBoundingClientRect(); return girado ? [e.clientY - r.top, r.right - e.clientX] : [e.clientX - r.left, e.clientY - r.top]; };
  cv.onpointerdown = e => { desenhando = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); };
  cv.onpointermove = e => { if (!desenhando) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); desenhou = true; };
  cv.onpointerup = cv.onpointercancel = () => { desenhando = false; };
  const fechar = () => { window.removeEventListener('resize', ajustar); v.remove(); try { if (document.fullscreenElement) document.exitFullscreen(); if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) { } };
  $('#as-limpar', v).onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); desenhou = false; };
  $('#as-cancelar', v).onclick = fechar;
  $('#as-ok', v).onclick = () => {
    const nome = $('#as-nome', v).value.trim();
    if (!nome) { aviso('Escreva o nome de quem assinou.', 'erro'); $('#as-nome', v).focus(); return; }
    if (!desenhou) { aviso('Peça para a pessoa assinar no quadro.', 'erro'); return; }
    // fundo branco para o PDF
    const fundo = document.createElement('canvas'); fundo.width = cv.width; fundo.height = cv.height; const fc = fundo.getContext('2d');
    fc.fillStyle = '#fff'; fc.fillRect(0, 0, fundo.width, fundo.height); fc.drawImage(cv, 0, 0);
    enfileirar({ acao: 'assinaturaEnviar', tipo: 'assinatura', os: s._id, rotulo: 'assinatura de ' + s._id, dados: { id: s._id, base64: fundo.toDataURL('image/png'), responsavel: nome }, depois: () => depois && depois() });
    fechar(); aviso('Assinatura salva. Enviando em segundo plano.', 'ok');
    depois && depois();
  };
  setTimeout(() => $('#as-nome', v).focus(), 100);
}

function gradeModulos(d, marcados, doPerfil) {

 * O acesso é ligado ao funcionário. O que cada um faz é decidido pelos módulos:

      '<label class="campo"><span>Perfil</span><select data-c="ac_perfil" id="ac-perfil">' + d.perfis.map(p => '<option' + ((u ? u.perfil : 'Funcionário') === p.perfil ? ' selected' : '') + '>' + esc(p.perfil) + '</option>').join('') + '</select></label>' +

      '<label class="campo alternar"><input type="checkbox" id="ac-ativo" data-c="ac_ativo" data-t="bool"' + (!u || u.ativo ? ' checked' : '') + '><span style="margin:0;font-size:14px;color:var(--texto)">Acesso ativo (desmarque para bloquear)</span></label>' +

    const pintar = () => { $('#ac-mods', alvo).innerHTML = gradeModulos(d, u ? u.extras : [], perfilMods($('#ac-perfil', alvo).value)); };
    $('#ac-perfil', alvo).onchange = pintar; pintar();

    const mostrarTemp = t => { ctl.mostrouSenha = true; $('#ac-temp', alvo).innerHTML = '<div class="aviso-senha">Senha temporária: <b>' + esc(t) + '</b><br>Passe para a pessoa. No primeiro acesso ela cria a senha dela.</div>'; };
    const z = $('#ac-zerar', alvo); if (z) z.onclick = async () => { if (await perguntar('Zerar senha?', 'Gerar uma senha temporária nova para ' + u.login + '?', 'Gerar senha')) comBotao(z, async () => mostrarTemp((await api('usuarioSenha', { login: u.login })).senhaTemporaria)); };
    ctl.salvar = async nome => {
      if (!u && !(tem && tem.checked)) { aviso('Salvo.', 'ok'); return; }

      const r = await api('usuarioSalvar', { novo: !u, login: u ? u.login : $('#ac-login', alvo).value.trim().toLowerCase(), nome: nome, email: u ? u.email : '',
        perfil: $('#ac-perfil', alvo).value, extras, funcionario: nome, ativo: $('#ac-ativo', alvo).checked });
      aviso('Funcionário e acesso salvos.', 'ok');

    };
  }).catch(e => { alvo.innerHTML = '<div class="nota">' + esc(e.message) + '</div>'; });

      return '<div class="ck-eq" data-eq="' + esc(e.id) + '"><h4>' + ic('ar') + esc([e.local || e.id, e.tipo].filter(Boolean).join(' · ')) + ' <small>' + esc(e.id + ' · ' + e.checklist) + '</small>' +
        '<button type="button" class="btn sec mini ck-todos">Tudo OK</button></h4>' +
        (e.itens.length ? e.itens.map(i => (i.grupo !== g ? (g = i.grupo, '<div class="ck-grupo">' + esc(i.grupo) + '</div>') : '') +
          '<div class="ck-item" data-i="' + esc(i.id) + '" data-resp="' + esc(i.resp) + '"><div class="ck-txt">' + esc(i.item) + ' <small>' + esc(i.per) + '</small></div>' +
          (i.resp === 'Medição' ? '<div class="ck-med"><input type="text" inputmode="decimal" placeholder="valor" value="' + esc(String(i.medicao).replace('.', ',')) + '"><span>' + esc(i.un) + '</span></div>'
            : '<div class="segmento ck-res">' + bot(e, i, 'OK', 'OK', 'ok') + bot(e, i, 'NOK', 'NOK', 'nok') + bot(e, i, 'NA', 'NA', 'na') + '</div>') +
          '<input type="text" class="ck-obs" placeholder="Observação (opcional)" value="' + esc(i.obs) + '"></div>').join('') : '<div class="nota">Nada vence para este aparelho neste mês.</div>') + '</div>'; }).join('');
  $$('.ck-res', alvo).forEach(seg => $$('button', seg).forEach(b => b.onclick = () => { const on = !b.classList.contains('ativo'); $$('button', seg).forEach(x => x.classList.remove('ativo')); if (on) b.classList.add('ativo'); }));
  $$('.ck-todos', alvo).forEach(b => b.onclick = () => $$('.ck-res', b.closest('.ck-eq')).forEach(seg => { if (!$('.ativo', seg)) $('[data-v="OK"]', seg).classList.add('ativo'); }));
  const ler = () => $$('.ck-eq', alvo).map(eq => ({ id: eq.dataset.eq, itens: $$('.ck-item', eq).map(it => ({ id: it.dataset.i,
    resultado: ($('.ck-res .ativo', it) || { dataset: {} }).dataset.v || '', medicao: ($('.ck-med input', it) || {}).value || '', obs: $('.ck-obs', it).value })) }));
  const acoes = $('.acoes', j.el);
  const salvar = document.createElement('button'); salvar.className = 'btn verde'; salvar.innerHTML = ic('ok') + 'Salvar checklist'; acoes.appendChild(salvar);
  salvar.onclick = () => comBotao(salvar, async () => {
    const pend = $$('.ck-res', alvo).filter(seg => !$('.ativo', seg)).length;
    if (pend && !(await perguntar('Itens sem marcar', pend + ' item(ns) ficaram sem marcar. Salvar mesmo assim? Eles não entram no relatório.', 'Salvar'))) return;
    const r = await api('pmocRegistrar', { contrato: d.contrato, mes: d.mes, os: d.os, equipamentos: ler() });
    aviso(r.itens + ' itens salvos' + (r.nok ? ' · ' + r.nok + ' com problema' : '') + '.', r.nok ? 'aviso' : 'ok');
    j.fechar(); depois && depois();
  });
}

/* ===================== BOLETO: o banco emite, o sistema guarda e envia ===================== */
function janelaBoleto(reg, depois) {
  const j = janela('Boleto · ' + reg._id, '<div class="confirmar"><div class="grande">' + dinheiro(num(reg['Valor'])) + '</div>' + linhaConf('Descrição', reg['Descrição'] || '—') + linhaConf('Vencimento', dataBR(reg['Data'])) + '</div>' +
    '<p class="nota">Emita o boleto no app ou site do banco e anexe o PDF aqui (ou uma foto). Cole a linha digitável para o cliente poder copiar.</p>' +
    campoHTML({ c: 'linha', t: 'texto', rotulo: 'Linha digitável' }, reg['Linha digitável'] || '') +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px"><label class="btn sec">' + ic('subir') + (reg['Boleto'] ? 'Trocar PDF' : 'Anexar PDF ou foto') + '<input type="file" accept="application/pdf,image/*" hidden id="bl-arq"></label>' +
    (reg['Boleto'] ? botaoVer(reg['Boleto'], ic('olho') + 'Ver boleto', 'btn sec') : '<span></span>') + '</div><div id="bl-env"></div>',
    [{ txt: 'Fechar', classe: 'sec', fn: () => j.fechar() }, { txt: 'Salvar', fn: b => comBotao(b, async () => { const r = await api('boletoSalvar', { id: reg._id, linha: lerCampos(j.el).linha }); mostrarEnvio(r); aviso('Boleto salvo.', 'ok'); depois && depois(); }) }]);
  let arq = null;
  $('#bl-arq', j.el).onchange = async e => { const f = e.target.files[0]; if (!f) return;
    const pdf = f.type === 'application/pdf';
    try { arq = { base64: pdf ? await lerBase64(f) : await comprimir(f, 1800), mime: pdf ? 'application/pdf' : 'image/jpeg' }; } catch (x) { return aviso(x.message, 'erro'); }
    const b = $('.acoes .btn:not(.sec)', j.el);
    comBotao(b, async () => { const r = await api('boletoSalvar', Object.assign({ id: reg._id, linha: lerCampos(j.el).linha }, arq)); mostrarEnvio(r); aviso('Boleto anexado.', 'ok'); depois && depois(); });
  };
  function mostrarEnvio(r) {
    const msg = ola(r.trat) + '\nSegue o boleto da NG AR CONDICIONADO no valor de ' + dinheiro(r.valor) + ', vencimento ' + dataBR(r.venc) + '.' + (r.linha ? '\n\nLinha digitável:\n' + r.linha : '') + (r.url ? '\n\nBoleto: ' + r.url : '') + assinatura();
    $('#bl-env', j.el).innerHTML = '<div style="display:grid;gap:8px">' + (r.tel ? fora(linkZap(r.tel, msg), ic('zap') + 'Enviar para ' + esc(r.nome || 'o cliente'), 'btn zap largo') : '') +
      '<label class="campo" style="margin:0"><span>Ou enviar para outro número</span><input id="bl-num" type="tel" inputmode="tel"></label><a class="btn zap largo" id="bl-outro" target="_blank" rel="noopener" href="#">' + ic('zap') + 'Enviar para este número</a></div>';
    const i = $('#bl-num', j.el), a = $('#bl-outro', j.el); const at = () => a.href = linkZap(i.value, msg); i.oninput = at; at();
  }
}
